# Same prompt as starship.toml, but with every Nerd Font glyph swapped for a plain 7-bit-ASCII
# label so it renders correctly with no special font (not even a color-emoji font) installed. See
# docs/01-prepare-your-workstation.md step 8 for how to point STARSHIP_CONFIG at this file
# instead. The ☸ and ✓/✗ symbols were already plain Unicode, so they're unchanged from
# starship.toml.

format = """
$status\
$cmd_duration\
$git_branch\
$git_commit\
$git_status\
$kubernetes\
$docker_context\
$jobs\
$fill\
$time\
$line_break\
$username\
$hostname\
$directory\
$character"""

add_newline = true
palette = 'nord'


[status]
style = 'fg:green'
symbol = '[✗](red)'
success_symbol = '✓'
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
map_symbol = true
disabled = false

[cmd_duration]
min_time = 0
style = 'fg:#9099A6'
format = '[$duration]($style) '

[git_branch]
style = 'fg:green'
symbol = 'git:'
format = '[$symbol$branch(:$remote_branch) ]($style)'

[git_status]
style = 'fg:yellow'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[kubernetes]
# my-first-vks is entirely about the active kube context (Supervisor vs. workload
# cluster, switched via kubectx/kubens) — unlike the source config this is forked
# from, show this segment unconditionally rather than gating it on KUBECONFIG.
disabled = false
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
style = 'fg:purple'

[docker_context]
symbol = 'docker:'
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = '& '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[fill]
symbol = ' '

[time]
disabled = false
style = 'cyan bold'
format = '[ $time ]($style)'
time_format = '%T %Z %z'

[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_symbol = ' ssh: '
format = '[$ssh_symbol$hostname]($style) '

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = 'Docs'
'Downloads' = 'DL'
'Music' = 'Music'
'Pictures' = 'Pics'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
orange='#be5046'
yellow='#e5c07b'
gray='#828997'
white ='#abb2bf'
black='#2c323c'
