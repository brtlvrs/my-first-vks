# Upstream Headlamp's own quickstart binds this service account to cluster-admin. That's the
# wrong default for a teaching repo — bind to the built-in, read-only "view" ClusterRole instead.
# Cluster-wide scope is fine here (unlike the platform/ instance) because this whole guest
# cluster already belongs to a single tenant/vSphere Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
