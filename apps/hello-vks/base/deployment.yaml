apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-vks
  namespace: hello-vks
  labels:
    app: hello-vks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-vks
  template:
    metadata:
      labels:
        app: hello-vks
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-vks
          # nginx-unprivileged listens on 8080 and needs no root capabilities — this image was
          # picked specifically so the example works under the Restricted Pod Security Standard
          # out of the box. Swap it for your own image once you understand the pattern.
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
