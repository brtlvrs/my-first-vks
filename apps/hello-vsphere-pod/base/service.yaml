apiVersion: v1
kind: Service
metadata:
  name: hello-vsphere-pod
  namespace: CHANGE_ME_NAMESPACE   # overridden by `namespace:` in the overlay's kustomization.yaml
  annotations:
    # CHANGE_ME (maybe) — see apps/hello-vks/base/service.yaml's comment on this annotation.
    service.beta.kubernetes.io/vsphere-load-balancer-class: "nsx"
spec:
  type: LoadBalancer
  selector:
    app: hello-vsphere-pod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
