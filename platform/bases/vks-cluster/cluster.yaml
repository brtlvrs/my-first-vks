---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: base-cluster       # CHANGE_ME — overridden per overlay via a JSON6902 patch
  namespace: CHANGE_ME_NAMESPACE   # CHANGE_ME — overridden by `namespace:` in the overlay's kustomization.yml
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["10.96.0.0/12"]
    pods:
      cidrBlocks: ["192.168.0.0/16"]
  topology:
    classRef:
      # builtin-generic-v3.6.0 is the versioned generic ClusterClass shipped with VCF 9.1 / VKS 3.6 —
      # not customer-specific, but confirm it's still current for your Supervisor's VKS version with:
      #   kubectl get clusterclass -n vmware-system-vks-public
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: v1.35.5+vmware.1-vkr.1   # CHANGE_ME — pick a VKr version compatible with your Supervisor's VKS version
    controlPlane:
      replicas: 3   # CHANGE_ME — keep this odd (1, 3, 5): etcd needs a majority quorum
    workers:
      machineDeployments:
        - class: node-pool
          name: general-pool
          replicas: 4   # CHANGE_ME
    variables:
      - name: vmClass
        value: CHANGE_ME_VM_CLASS       # e.g. best-effort-small — see `kubectl get vmclass`
      - name: storageClass
        value: CHANGE_ME_STORAGE_CLASS  # e.g. a storage policy name from `kubectl get storageclass`
