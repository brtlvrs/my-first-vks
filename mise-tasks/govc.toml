["govc:login"]
description = "Log in to vCenter (GOVC_URL) with govc, prompting for username/password. Persists the session to ~/.govmomi/sessions/ so later govc commands don't re-prompt."
tools = { "github:vmware/govmomi[exe=govc]" = "latest" }
run = '''
set -euo pipefail

: "${GOVC_URL:?Missing GOVC_URL env var -- fill in CHANGE_ME_GOVC_URL in the root mise.toml first.}"

CA_CERT="${MISE_PROJECT_ROOT}/vcsa-ca.pem"
if [ -f "${CA_CERT}" ]; then
    export GOVC_TLS_CA_CERTS="${CA_CERT}"
else
    echo "No CA cert at ${CA_CERT} (see docs/06-connecting-to-supervisor.md) -- connecting insecurely (GOVC_INSECURE=true)." >&2
    export GOVC_INSECURE=true
fi

read -rp "vCenter username: " GOVC_USERNAME
export GOVC_USERNAME

read -rsp "vCenter password: " GOVC_PASSWORD
export GOVC_PASSWORD
echo

govc session.login
govc about
'''

["govc:logout"]
description = "Log out of the current govc session against GOVC_URL."
tools = { "github:vmware/govmomi[exe=govc]" = "latest" }
run = '''
set -euo pipefail

: "${GOVC_URL:?Missing GOVC_URL env var -- fill in CHANGE_ME_GOVC_URL in the root mise.toml first.}"

CA_CERT="${MISE_PROJECT_ROOT}/vcsa-ca.pem"
if [ -f "${CA_CERT}" ]; then
    export GOVC_TLS_CA_CERTS="${CA_CERT}"
else
    export GOVC_INSECURE=true
fi

govc session.logout
'''
